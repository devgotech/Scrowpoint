# ============================================================================
# SCROWPOINT ESCROW — LOCAL DEVELOPMENT DOCKER COMPOSE
# ============================================================================
version: '3.8'

services:
  # 1. PostgreSQL 16 Database with Append-Only Escrow Ledger Schema
  postgres:
    image: postgres:16-alpine
    container_name: scrowpoint_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: scrowpoint
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./core-backend/internal/db/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d scrowpoint"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Go Core Escrow & State Machine Backend
  core-backend:
    build:
      context: ./core-backend
      dockerfile: Dockerfile
    container_name: scrowpoint_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 8080
      ENV: development
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/scrowpoint?sslmode=disable
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: scrowpoint
      JWT_SECRET: scrowpoint-local-dev-jwt-secret-2026
      JWT_EXPIRATION_HOURS: 168
      PAYSTACK_SECRET_KEY: sk_test_scrowpoint_mock_paystack_secret_key
      PAYSTACK_PUBLIC_KEY: pk_test_scrowpoint_mock_paystack_public_key
      SMILE_ID_PARTNER_ID: smile_partner_test_8492
      SMILE_ID_API_KEY: smile_api_key_test_9482018492
      MEDIA_SERVICE_URL: http://media-service:8000
    ports:
      - "8080:8080"

  # 3. Python FastAPI Media Microservice (EXIF stripping & WebP conversion)
  media-service:
    build:
      context: ./media-service
      dockerfile: Dockerfile
    container_name: scrowpoint_media
    restart: unless-stopped
    environment:
      PORT: 8000
      STORAGE_BACKEND: local
      LOCAL_STORAGE_DIR: /tmp/scrowpoint_media
      CDN_BASE_URL: http://localhost:8000/media
    ports:
      - "8000:8000"
    volumes:
      - media_storage:/tmp/scrowpoint_media

volumes:
  postgres_data:
  media_storage:
