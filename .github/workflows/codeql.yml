name: CodeQL

# Free static security analysis (GitHub code scanning; free for public repos).
# Finds injection, auth/authorization mistakes, unsafe data flows and similar
# bugs in the Go API, the Next.js frontend, the Python media service and these
# workflow files. Alerts appear under Security -> Code scanning and on PRs.
# To block merges on new high-severity alerts, add the "Require code scanning
# results" rule for CodeQL on staging and main (see BRANCHING_AND_RELEASES.md).

on:
  push:
    branches: [dev, staging, main]
  pull_request:
    branches: [staging, main]
  schedule:
    - cron: "23 4 * * 1" # weekly, Monday 04:23 UTC — catches newly published queries
  workflow_dispatch:

permissions: {}

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: go
            build-mode: manual
          - language: javascript-typescript
            build-mode: none
          - language: python
            build-mode: none
          - language: actions
            build-mode: none
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        if: matrix.language == 'go'
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          check-latest: true
          cache-dependency-path: core-backend/go.sum

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended

      - name: Build Go backend
        if: matrix.language == 'go'
        working-directory: core-backend
        run: go build ./...

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
