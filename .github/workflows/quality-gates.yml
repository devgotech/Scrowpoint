name: Quality Gates

on:
  push:
    branches:
      - dev
      - staging
      - main
  pull_request:
    branches:
      - staging
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go tests, vet, and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          # Latest 1.26 patch, matching the golang:1.26-alpine production image.
          go-version: "1.26.x"
          check-latest: true
          cache-dependency-path: core-backend/go.sum

      - name: Run Go tests
        working-directory: core-backend
        run: go test ./...

      - name: Run Go vet
        working-directory: core-backend
        run: go vet ./...

      - name: Build Go backend
        working-directory: core-backend
        run: go build ./...

  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend-web/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefix frontend-web

      - name: Lint frontend
        run: npm --prefix frontend-web run lint

      - name: Build frontend
        run: npm --prefix frontend-web run build

  media:
    name: Media service tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: media-service/requirements.txt

      - name: Install media service dependencies
        run: python -m pip install -r media-service/requirements.txt

      - name: Run media service tests
        working-directory: media-service
        run: python -m unittest discover -s tests -v

  dependency-audit:
    name: Dependency vulnerability audit
    # Free checks against public vulnerability databases. Fails on known
    # vulnerabilities that can affect production (Go: only ones your code
    # actually calls; npm: high/critical in production deps; Python: any).
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          check-latest: true
          cache-dependency-path: core-backend/go.sum

      - name: Go — govulncheck
        working-directory: core-backend
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend-web/package-lock.json

      - name: Frontend — npm audit (production dependencies)
        run: npm audit --prefix frontend-web --omit=dev --audit-level=high

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Media service — pip-audit
        run: |
          python -m pip install --quiet pip-audit
          pip-audit --requirement media-service/requirements.txt

  quality-gates:
    name: Quality Gates
    if: always()
    needs:
      - go
      - frontend
      - media
      - dependency-audit
    runs-on: ubuntu-latest
    steps:
      - name: Require every quality job to pass
        env:
          GO_RESULT: ${{ needs.go.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          MEDIA_RESULT: ${{ needs.media.result }}
          AUDIT_RESULT: ${{ needs.dependency-audit.result }}
        run: |
          test "${GO_RESULT}" = "success"
          test "${FRONTEND_RESULT}" = "success"
          test "${MEDIA_RESULT}" = "success"
          test "${AUDIT_RESULT}" = "success"
