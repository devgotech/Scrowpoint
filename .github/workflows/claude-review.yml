name: Claude Review

# AI code review for every pull request into main (the staging -> main release PR).
# Claude posts inline comments, then returns a structured verdict. The final step
# fails this job when the verdict has blocking issues, so making the
# "Claude Review" check required on main stops risky code reaching production.
#
# Setup (once): see BRANCHING_AND_RELEASES.md -> "AI review before main".
#   - Install the Claude GitHub App on this repository.
#   - Add ONE secret: CLAUDE_CODE_OAUTH_TOKEN (uses your Claude plan; create it
#     with `claude setup-token`) or ANTHROPIC_API_KEY (pay-per-use API billing).
#   - Optional repo variable CLAUDE_REVIEW_MODEL to change model
#     (default claude-opus-5-5; e.g. claude-fable-5-2 for deeper release reviews).

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - main

permissions: {}

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    name: Claude Review
    # Skip drafts and PRs from forks (public repo: forks get no secrets and are untrusted).
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Review with Claude
        id: review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allow_fork_prs: "false"
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            You are the required pre-production reviewer for Scrowpoint, a peer-to-peer
            gadget marketplace that holds buyer money in escrow (Paystack) and verifies
            identities (SmileID KYC). This PR is about to ship to production users.
            Stack: Next.js frontend (frontend-web/), Go escrow API (core-backend/),
            Python media service (media-service/). Project rules live in
            context_docs/ and frontend-web/AGENTS.md.

            1. Read the change with `gh pr view` and `gh pr diff`. Open surrounding
               code with Read/Grep/Glob when you need context; don't review files
               the PR didn't touch.
            2. Look hardest for problems that would hurt users, money or data:
               - escrow/payment state changes: double release, refund to the wrong
                 party, amounts in naira vs kobo, missing idempotency on webhooks,
                 unverified Paystack signatures
               - auth and access control: missing ownership/role checks, admin or
                 mediator routes reachable by normal users, JWT handling
               - secrets or credentials committed (.env files, live keys, passwords)
               - KYC/evidence files exposed publicly, EXIF not stripped
               - SQL/command injection, unvalidated input, CORS widened to "*"
               - crashes, broken builds, data loss, migrations that drop data
               Then normal bugs, and briefly anything that breaks project rules
               (e.g. hard-coded colours/radii instead of design tokens).
            3. Post each specific issue as an inline comment on the exact line with
               mcp__github_inline_comment__create_inline_comment. Say what goes
               wrong, for whom, and how to fix it. No comments for style nitpicks or
               praise.
            4. Post ONE top-level summary with `gh pr comment`: a verdict line
               ("✅ No blocking issues" or "⛔ N blocking issues"), the blocking
               issues, then other findings.

            Blocking = would cause a security hole, loss or misdirection of money,
            data loss/leak, or a production outage/crash if merged now. Everything
            else is non-blocking. Be precise; do not block on speculation.

            Finish by returning the structured verdict.
          claude_args: |
            --model ${{ vars.CLAUDE_REVIEW_MODEL || 'claude-opus-5-5' }}
            --max-turns 60
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Read,Glob,Grep"
            --json-schema '{"type":"object","additionalProperties":false,"required":["verdict","blocking_issues","summary"],"properties":{"verdict":{"type":"string","enum":["pass","block"]},"summary":{"type":"string"},"blocking_issues":{"type":"array","items":{"type":"object","additionalProperties":false,"required":["file","title","why"],"properties":{"file":{"type":"string"},"line":{"type":"integer"},"title":{"type":"string"},"why":{"type":"string"}}}}}}'

      - name: Enforce review verdict
        if: always()
        env:
          VERDICT_JSON: ${{ steps.review.outputs.structured_output }}
          REVIEW_CONCLUSION: ${{ steps.review.outputs.conclusion }}
        run: |
          set -euo pipefail
          {
            echo "## Claude Review"
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ -z "${VERDICT_JSON}" ]] || ! echo "${VERDICT_JSON}" | jq -e . >/dev/null 2>&1; then
            echo "Claude did not return a verdict (run conclusion: ${REVIEW_CONCLUSION:-unknown})." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "Re-run this job. If it keeps failing, check the secret and the Claude GitHub App install." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          verdict="$(echo "${VERDICT_JSON}" | jq -r '.verdict')"
          count="$(echo "${VERDICT_JSON}" | jq '.blocking_issues | length')"
          {
            echo "**Verdict:** ${verdict} (${count} blocking)"
            echo
            echo "${VERDICT_JSON}" | jq -r '.summary'
            echo
            echo "${VERDICT_JSON}" | jq -r '.blocking_issues[] | "- ⛔ `\(.file)\(if .line then ":\(.line)" else "" end)` — **\(.title)**: \(.why)"'
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "${verdict}" == "block" || "${count}" -gt 0 ]]; then
            echo "::error::Claude Review found ${count} blocking issue(s). Fix them, or merge with an admin override if you disagree."
            exit 1
          fi
          echo "Claude Review passed."
