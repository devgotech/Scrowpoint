# ============================================================================
# SCROWPOINT WORKSPACE — RENDER CLOUD BLUEPRINT SPECIFICATION (render.yaml)
#
# Use this Blueprint to deploy the Go Core Backend and Python Media Service
# on Render ("New +" -> "Blueprint" -> Connect your repository).
# ============================================================================

services:
  # --------------------------------------------------------------------------
  # 1. CORE ESCROW & STATE MACHINE BACKEND (Go 1.22 Docker Service)
  # --------------------------------------------------------------------------
  - type: web
    name: scrowpoint-core-backend
    runtime: docker
    rootDir: core-backend
    dockerfilePath: ./Dockerfile
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 8080
      - key: ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: scrowpoint-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION_HOURS
        value: 168
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: PAYSTACK_PUBLIC_KEY
        sync: false
      - key: SMILE_ID_PARTNER_ID
        sync: false
      - key: SMILE_ID_API_KEY
        sync: false
      - key: MEDIA_SERVICE_URL
        fromService:
          type: web
          name: scrowpoint-media-service
          envVarKey: RENDER_EXTERNAL_URL
      # SEC-10: Restrict CORS to your deployed frontend domain
      - key: CORS_ALLOWED_ORIGIN
        sync: false
      # SEC-02 & SEC-03: Ensure dev bypasses are explicitly disabled
      - key: ALLOW_DEV_MOCK_PAYMENTS
        value: "false"
      - key: SEED_DEV_ADMIN
        value: "false"

  # --------------------------------------------------------------------------
  # 2. MEDIA & EXIF-STRIPPING MICROSERVICE (Python 3.11 FastAPI Docker Service)
  # --------------------------------------------------------------------------
  - type: web
    name: scrowpoint-media-service
    runtime: docker
    rootDir: media-service
    dockerfilePath: ./Dockerfile
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 8000
      - key: ENVIRONMENT
        value: production
      - key: STORAGE_BACKEND
        value: s3
      - key: LOCAL_STORAGE_DIR
        value: /var/data/scrowpoint_media
      - key: JWT_SECRET
        fromService:
          type: web
          name: scrowpoint-core-backend
          envVarKey: JWT_SECRET
      - key: STRIP_EXIF
        value: "true"
      - key: MAX_UPLOAD_SIZE_MB
        value: "15"
      - key: CORS_ALLOWED_ORIGIN
        sync: false
      # Use separate buckets. For R2, set S3_ENDPOINT_URL to the account R2 endpoint
      # and S3_REGION to "auto". For AWS S3, leave S3_ENDPOINT_URL unset.
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_ENDPOINT_URL
        sync: false
      - key: S3_PUBLIC_BUCKET_NAME
        sync: false
      - key: S3_PRIVATE_BUCKET_NAME
        sync: false
      - key: CDN_BASE_URL
        sync: false

databases:
  # --------------------------------------------------------------------------
  # 3. MANAGED POSTGRESQL 16 DATABASE
  # --------------------------------------------------------------------------
  - name: scrowpoint-db
    databaseName: scrowpoint
    user: scrowpoint_user
    plan: starter
    postgresMajorVersion: "16"
